name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  emacs:
    name: Emacs ${{ matrix.emacs }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs: ['30.1', '31.1', snapshot]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile
        run: make compile
      - name: Test
        run: make test
